<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f8fc">
<title>Ma CAA École — Version 2 bêta 3</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#25314d;--muted:#68738a;--line:#e5e9f2;--accent:#6657d9;--accent2:#eeeafd;--shadow:0 8px 24px rgba(49,57,90,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-size:24px;font-weight:900;letter-spacing:-.5px}.logo span{color:var(--accent)}
.profile{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:16px;padding:8px 12px;font-weight:800}
.app{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 62px)}
.sidebar{position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto;padding:16px 12px;border-right:1px solid var(--line);background:#fff}
.navbtn{width:100%;border:0;background:transparent;border-radius:16px;padding:13px 14px;margin-bottom:8px;text-align:left;font-weight:850;color:var(--ink);display:flex;align-items:center;gap:10px;font-size:16px}
.navbtn.active{background:var(--accent2);color:#4e41b9}
.main{padding:20px;min-width:0}.hero{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:28px;margin:0 0 4px}.subtitle{margin:0;color:var(--muted);font-weight:650}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;color:var(--ink)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--card);border-radius:22px;min-height:150px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;transition:.12s transform,.12s box-shadow}
.card:active{transform:scale(.98)}.card .emoji{font-size:44px}.card .big{font-size:42px;font-weight:950;line-height:1}.card .label{font-weight:900;font-size:17px}.card .small{color:var(--muted);font-weight:650;font-size:13px}
.word-builder{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:18px;margin-bottom:18px}
.word-display{min-height:78px;border:2px dashed #d9d5fa;background:#faf9ff;border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;font-size:38px;font-weight:950;letter-spacing:3px}
.word-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:center}.action{border:0;border-radius:14px;padding:11px 15px;font-weight:850;background:var(--accent2);color:#4e41b9}.action.primary{background:var(--accent);color:#fff}
.letter-bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}.letter{min-height:72px;border:1px solid var(--line);background:#fff;border-radius:18px;font-size:28px;font-weight:950;box-shadow:0 4px 12px rgba(49,57,90,.07)}
.notice{padding:14px 16px;background:#fff8df;border:1px solid #f4e2a0;border-radius:16px;color:#725a00;font-weight:700;margin-bottom:16px}
.footer{padding:26px 8px;text-align:center;color:#8992a8;font-size:12px;font-weight:700}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:61px;z-index:15;height:auto;display:flex;overflow:auto;gap:8px;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.navbtn{width:auto;white-space:nowrap;margin:0;padding:10px 12px}.main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-height:135px}}

[hidden]{display:none!important}.headtools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.smallbtn{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800;color:var(--ink)}
.landing{max-width:980px;margin:48px auto;padding:0 18px;text-align:center}.landing h1{font-size:38px}.search{width:100%;padding:16px;border:2px solid #dce3f2;border-radius:16px;font-size:17px;margin:22px 0 18px;background:#fff}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px}.profiletile{border:2px solid #dfe5f2;background:#fff;padding:24px 10px;border-radius:23px;min-height:166px;box-shadow:var(--shadow);font-size:17px;font-weight:800;overflow-wrap:anywhere}
.avatar{width:79px;height:79px;border-radius:50%;background:#edf2ff;display:flex;align-items:center;justify-content:center;color:#304877;font-weight:900;font-size:27px;margin:0 auto 14px;overflow:hidden;flex:0 0 auto}.avatar.small{width:52px;height:52px;font-size:18px;margin:0}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.editor{padding:18px;background:white;border:1px solid var(--line);border-radius:24px;margin:14px 0;box-shadow:var(--shadow)}.editor h2{margin:0 0 14px}.fields{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}.fields input,.fields select{padding:11px 12px;border:1px solid #d5dbea;border-radius:12px;max-width:100%;min-width:120px;background:#fff}.fields input[type=file]{padding:8px;background:#fff}
.editrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}.editrow button{margin:2px}.subheading{font-size:20px;font-weight:850;margin:20px 0 10px}.imageicon{max-height:70px;max-width:80px;object-fit:contain}.modepill{padding:8px 12px;background:var(--accent2);border-radius:999px;font-weight:800}.helper{color:var(--muted);font-size:14px}.danger{color:#a42f3d}.right{margin-left:auto}
.modepage{max-width:1120px;margin:0 auto}.modehero{background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px 18px 14px;box-shadow:var(--shadow);margin-bottom:16px}.modehero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#53627f}.modehero h2{font-size:34px;margin:2px 0 6px}.modehero p{margin:0;color:var(--muted);font-weight:650}.dashsearch{margin-top:14px}.dashsearch input{width:100%;padding:15px 16px;border:2px solid #dce3f2;border-radius:16px;font-size:16px;background:#fff}.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}.dashboard-card{border:0;border-radius:24px;padding:24px 22px;min-height:138px;color:#fff;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;font-weight:900}.dashboard-card .dashicon{font-size:34px}.dashboard-card .dashtitle{font-size:20px;line-height:1.1}.dashboard-card .dashsmall{font-size:13px;font-weight:700;opacity:.92}.dashboard-card.blue{background:#5982d9}.dashboard-card.purple{background:#8a66db}.dashboard-card.green{background:#26a867}.dashboard-card.orange{background:#ed9136}.dashboard-card.gray{background:#71798b}.dashboard-card.indigo{background:#425ea7}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.profileline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.avatar-choice{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.previewbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed #cfd7ea;border-radius:14px;background:#fafbff}.pillnote{display:inline-block;padding:6px 10px;border-radius:999px;background:#f3f5fb;color:#51607e;font-weight:800;font-size:12px}
@media(max-width:760px){.landing{margin-top:24px}.landing h1{font-size:27px}.headtools{gap:3px}.smallbtn{padding:8px;font-size:12px}.profiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}.modehero h2{font-size:26px}}
</style>
</head>
<body>
<header class="topbar"><div class="logo">🎒 Ma CAA <span>École</span></div><div id="headtools" class="headtools"></div></header><section id="landing" class="landing"></section>
<div class="app" id="workspace" hidden>
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="hero"><div><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></div></div>
    <div id="content"></div>
    <div class="footer">Ma CAA École — Version 2 bêta 3 • indépendante de Ma CAA</div>
  </main>
</div>
<script>
"use strict";
const STORE_PREFIX="ma-caa-ecole-v1-";
const LETTERS=[
 {l:"A",name:"a",sound:"a",hint:"comme dans avion"},{l:"B",name:"bé",sound:"b",hint:"comme dans bateau"},
 {l:"C",name:"cé",sound:"k",hint:"son principal : k"},{l:"D",name:"dé",sound:"d",hint:"comme dans domino"},
 {l:"E",name:"e",sound:"e",hint:"comme dans petit"},{l:"F",name:"effe",sound:"fff",hint:"comme dans fleur"},
 {l:"G",name:"gé",sound:"g",hint:"son principal : g"},{l:"H",name:"ache",sound:"",hint:"souvent muet"},
 {l:"I",name:"i",sound:"i",hint:"comme dans île"},{l:"J",name:"ji",sound:"j",hint:"comme dans jardin"},
 {l:"K",name:"ka",sound:"k",hint:"comme dans kiwi"},{l:"L",name:"elle",sound:"lll",hint:"comme dans lune"},
 {l:"M",name:"emme",sound:"mmm",hint:"comme dans maman"},{l:"N",name:"enne",sound:"nnn",hint:"comme dans nez"},
 {l:"O",name:"o",sound:"o",hint:"comme dans orange"},{l:"P",name:"pé",sound:"p",hint:"comme dans papa"},
 {l:"Q",name:"ku",sound:"k",hint:"comme dans quatre"},{l:"R",name:"erre",sound:"rrr",hint:"comme dans roue"},
 {l:"S",name:"esse",sound:"sss",hint:"comme dans soleil"},{l:"T",name:"té",sound:"t",hint:"comme dans tomate"},
 {l:"U",name:"u",sound:"u",hint:"comme dans lune"},{l:"V",name:"vé",sound:"vvv",hint:"comme dans vélo"},
 {l:"W",name:"double vé",sound:"w",hint:"selon les mots"},{l:"X",name:"ix",sound:"ks",hint:"comme dans taxi"},
 {l:"Y",name:"i grec",sound:"i",hint:"comme dans stylo"},{l:"Z",name:"zède",sound:"zzz",hint:"comme dans zoo"}];

const VOCAB={
 "École":[["🎒","cartable"],["✏️","crayon"],["📖","livre"],["📓","cahier"],["✂️","ciseaux"],["📏","règle"],["🧴","colle"],["🖍️","feutre"],["🏫","école"],["🪑","chaise"]],
 "Halloween":[["🎃","citrouille"],["👻","fantôme"],["🧙","sorcière"],["🦇","chauve-souris"],["🕷️","araignée"],["🍬","bonbon"],["🧛","vampire"],["💀","squelette"]],
 "Noël":[["🎄","sapin"],["🎅","Père Noël"],["🎁","cadeau"],["⭐","étoile"],["🔔","cloche"],["☃️","bonhomme de neige"],["🦌","renne"],["❄️","neige"]],
 "Automne":[["🍂","feuille"],["🌰","châtaigne"],["🍄","champignon"],["🌧️","pluie"],["☂️","parapluie"],["🐿️","écureuil"]],
 "Hiver":[["❄️","neige"],["☃️","bonhomme de neige"],["🧣","écharpe"],["🧤","gants"],["🥶","froid"],["⛷️","ski"]],
 "Printemps":[["🌷","tulipe"],["🌼","fleur"],["🐝","abeille"],["🦋","papillon"],["🌦️","averse"],["🌱","pousse"]],
 "Été":[["☀️","soleil"],["🏖️","plage"],["🍦","glace"],["🕶️","lunettes de soleil"],["🏊","piscine"],["🍉","pastèque"]]
};

const CONSIGNES=[["⭕","Entoure"],["❌","Barre"],["🎨","Colorie"],["🔗","Relie"],["✂️","Découpe"],["🧴","Colle"],["✍️","Écris"],["📖","Lis"],["👂","Écoute"],["👀","Regarde"],["➖","Souligne"],["🔢","Compte"],["📦","Range"],["✅","Coche"],["🖌️","Dessine"]];
let CATS=[["alphabet","🔤","Alphabet","Nom ou son des lettres"],["writing","✍️","Écriture","Composer et écouter un mot"],["vocab","🖼️","Vocabulaire","Des mots classés par thèmes"],["numbers","🔢","Les nombres","Reconnaître, nommer et compter"],["instructions","📋","Les consignes","Comprendre les consignes scolaires"]];
let state={cat:"alphabet",alphabetMode:"name",vocabTheme:"École",word:""};

function speak(text,rate=.9){if(!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=rate;speechSynthesis.speak(u)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderSidebar(){const box=document.getElementById("sidebar");box.innerHTML="";if(activeProfile){const f=button("⭐ Favoris",()=>{state.cat="__favorites";render()},"navbtn"+(state.cat==="__favorites"?" active":""));box.append(f)}CATS.filter(([id])=>visible(id,"cat")).forEach(([id,icon,name])=>{const b=document.createElement("button");b.className="navbtn"+(state.cat===id?" active":"");b.innerHTML=`<span>${icon}</span><span>${name}</span>`;b.onclick=()=>{state.cat=id;render()};box.appendChild(b)})}
function setHead(name,sub){document.getElementById("title").textContent=name;document.getElementById("subtitle").textContent=sub}
function card(icon,label,small,onClick,big=false){const d=document.createElement("button");d.className="card";d.innerHTML=`<div class="${big?"big":"emoji"}">${esc(icon)}</div><div class="label">${esc(label)}</div>${small?`<div class="small">${esc(small)}</div>`:""}`;d.onclick=onClick;return d}
function tabs(names,current,onChoose){const d=document.createElement("div");d.className="tabs";names.forEach(n=>{const b=document.createElement("button");b.className="tab"+(n===current?" active":"");b.textContent=n;b.onclick=()=>onChoose(n);d.appendChild(b)});return d}

function renderAlphabet(root){
 setHead("Alphabet","Choisir si l'enfant entend le nom de la lettre ou le son qu'elle fait.");
 root.appendChild(tabs(["Nom des lettres","Son des lettres"],state.alphabetMode==="name"?"Nom des lettres":"Son des lettres",n=>{state.alphabetMode=n==="Nom des lettres"?"name":"sound";render()}));
 const note=document.createElement("div");note.className="notice";note.textContent=state.alphabetMode==="name"?"Ici, un clic sur M dit « ème » : on travaille le nom de la lettre.":"Ici, un clic sur M fait « mmm » : on travaille le son de la lettre.";root.appendChild(note);
 const g=document.createElement("div");g.className="grid";LETTERS.forEach(x=>{const spoken=state.alphabetMode==="name"?x.name:x.sound;g.appendChild(card(x.l,x.l,state.alphabetMode==="name"?"Nom de la lettre":x.hint,()=>speak(spoken),true))});root.appendChild(g)
}
function renderWriting(root){
 setHead("Écriture","L'enfant compose un mot avec les lettres. Chaque lettre produit son son.");
 const w=document.createElement("div");w.className="word-builder";const display=document.createElement("div");display.className="word-display";display.textContent=state.word||"…";w.appendChild(display);
 const actions=document.createElement("div");actions.className="word-actions";
 const read=document.createElement("button");read.className="action primary";read.textContent="🔊 Lire le mot";read.onclick=()=>speak(state.word||"");
 const back=document.createElement("button");back.className="action";back.textContent="⌫ Effacer une lettre";back.onclick=()=>{state.word=state.word.slice(0,-1);render()};
 const clear=document.createElement("button");clear.className="action";clear.textContent="🗑️ Effacer tout";clear.onclick=()=>{state.word="";render()};
 actions.append(read,back,clear);w.appendChild(actions);root.appendChild(w);
 const note=document.createElement("div");note.className="notice";note.textContent="Quand l'enfant choisit une lettre, l'application prononce son son. « Lire le mot » prononce ensuite le mot entier.";root.appendChild(note);
 const bank=document.createElement("div");bank.className="letter-bank";LETTERS.forEach(x=>{const b=document.createElement("button");b.className="letter";b.textContent=x.l;b.onclick=()=>{state.word+=x.l.toLowerCase();speak(x.sound);render()};bank.appendChild(b)});root.appendChild(bank)
}
function renderVocab(root){setHead("Vocabulaire","Choisir un thème puis toucher une image pour entendre le mot.");root.appendChild(tabs(Object.keys(VOCAB),state.vocabTheme,n=>{state.vocabTheme=n;render()}));const g=document.createElement("div");g.className="grid";VOCAB[state.vocabTheme].forEach(([em,word])=>g.appendChild(card(em,word,"",()=>speak(word))));root.appendChild(g)}
function renderNumbers(root){setHead("Les nombres","Toucher un nombre pour l'entendre.");const g=document.createElement("div");g.className="grid";for(let i=0;i<=20;i++){const dots=i<=10&&i>0?"● ".repeat(i).trim():(i===0?"aucune quantité":"");g.appendChild(card(String(i),String(i),dots,()=>speak(String(i)),true))}root.appendChild(g)}
function renderInstructions(root){setHead("Les consignes","Toucher une consigne pour l'entendre.");const g=document.createElement("div");g.className="grid";CONSIGNES.forEach(([em,w])=>g.appendChild(card(em,w,"",()=>speak(w))));root.appendChild(g)}
function render(){if(!activeProfile)return;renderSidebar();const root=document.getElementById("content");root.innerHTML="";if(state.cat==="alphabet")renderAlphabet(root);if(state.cat==="writing")renderWriting(root);if(state.cat==="vocab")renderVocab(root);if(state.cat==="numbers")renderNumbers(root);if(state.cat==="instructions")renderInstructions(root);renderExtras(root)}

// Données propres à Ma CAA École : aucune lecture ni écriture dans Ma CAA.
const SCHOOL_KEY='ma-caa-ecole-v2-profiles-data';
const defaultBase=()=>({categories:CATS.map(([id,icon,name,desc])=>({id,icon,name,desc,children:[]})),items:[],overrides:{}});
let db,activeProfile=null,mode='student',editCategory='alphabet',profileQuery='',editing=false;
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function persist(){try{localStorage.setItem(SCHOOL_KEY,JSON.stringify(db))}catch(e){alert('Impossible de sauvegarder : espace de stockage saturé. Réduis les images.')}}
function initSchool(){
 try{db=JSON.parse(localStorage.getItem(SCHOOL_KEY)||'null')}catch(e){}
 if(!db||!Array.isArray(db.profiles)||!db.base)db={profiles:[],base:defaultBase(),settings:{}};
 if(!Array.isArray(db.base.categories))db.base=defaultBase();
 db.base.items ||= []; db.base.overrides ||= {};db.settings ||= {};
 db.profiles.forEach(p=>{p.avatar ||= '';p.avatarImage ||= '';p.custom ||= [];p.hidden ||= [];p.modified ||= {};p.favorites ||= [];p.order ||= {}});
 CATS=db.base.categories.map(c=>[c.id,c.icon,c.name,c.desc]);
 showLanding();
}
function $id(id){return document.getElementById(id)}
function button(title,fn,cls='smallbtn'){const b=document.createElement('button');b.className=cls;b.textContent=title;b.onclick=fn;return b}
function node(tag,txt,cls){const el=document.createElement(tag);if(txt!=null)el.textContent=txt;if(cls)el.className=cls;return el}
function field(val='',placeholder=''){const i=node('input');i.value=val;i.placeholder=placeholder;return i}
function selection(choices,value){const el=node('select');choices.forEach(([v,t])=>{const o=node('option',t);o.value=v;el.append(o)});el.value=value;return el}
function active(){return db.profiles.find(p=>p.id===activeProfile)}
function extra(){const p=active();if(p){p.custom ||= [];p.hidden ||= [];p.modified ||= {};p.favorites ||= [];p.order ||= {};}return p}
function initials(name){return (name||'').trim().split(/\s+/).filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase()||'👤'}
function avatarNode(profile,cls='avatar'){const box=node('div',null,cls);if(profile?.avatarImage){const img=node('img');img.src=profile.avatarImage;img.alt=profile.name||'Profil';box.append(img)}else box.textContent=(profile?.avatar||'').trim()||initials(profile?.name);return box}
function readFileAsDataURL(file,cb){if(!file)return cb('');const reader=new FileReader();reader.onload=()=>cb(String(reader.result||''));reader.readAsDataURL(file)}
function attachPanelFilter(input,root){input.oninput=()=>{const q=input.value.trim().toLocaleLowerCase('fr');[...root.querySelectorAll('.filter-item')].forEach(el=>{el.hidden=!!q && !el.textContent.toLocaleLowerCase('fr').includes(q)})}}
function jumpToSection(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function dashboardCard(icon,title,small,cls,id){const b=button('',()=>jumpToSection(id),'dashboard-card '+cls);b.innerHTML=`<div class="dashicon">${icon}</div><div class="dashtitle">${esc(title)}</div><div class="dashsmall">${esc(small)}</div>`;return b}
function modeHeader(root,eyebrow,title,subtitle,searchPlaceholder){const wrap=node('section',null,'modehero');const top=node('div',null,'modehero-top');const left=node('div');left.append(node('div',eyebrow,'eyebrow'));const h=node('h2');h.textContent=title;left.append(h,node('p',subtitle));top.append(left);wrap.append(top);if(searchPlaceholder){const sr=node('div',null,'dashsearch');const input=field('',searchPlaceholder);sr.append(input);wrap.append(sr);root.append(wrap);return input}root.append(wrap);return null}
function profileForm(parent,profile){let imageValue=profile?.avatarImage||'';const name=field(profile?.name||'','Nom du profil (classe ou élève)');const avatar=field(profile?.avatar||'','Emoji / texte court facultatif');const imgInput=node('input');imgInput.type='file';imgInput.accept='image/*';const clearImg=button('Retirer l’image',()=>{imageValue='';preview.replaceChildren(avatarNode({name:name.value,avatar:avatar.value,avatarImage:''},'avatar small'))});const preview=node('div',null,'previewbox');const updatePreview=()=>{preview.replaceChildren(avatarNode({name:name.value,avatar:avatar.value,avatarImage:imageValue},'avatar small'),node('span',imageValue?'Image du profil':'Aperçu du profil'));};name.oninput=avatar.oninput=updatePreview;imgInput.onchange=()=>readFileAsDataURL(imgInput.files?.[0],data=>{if(data){imageValue=data;updatePreview()}});updatePreview();const save=button(profile?'Enregistrer le profil':'➕ Créer le profil',()=>{if(!name.value.trim())return alert('Indique un nom.');if(profile){profile.name=name.value.trim();profile.avatar=avatar.value.trim().slice(0,6);profile.avatarImage=imageValue}else db.profiles.push({id:uid(),name:name.value.trim(),avatar:avatar.value.trim().slice(0,6),avatarImage:imageValue,custom:[],hidden:[],modified:{},favorites:[],order:{}});persist();renderAdmin(rootReset())});const line=node('div',null,'fields');line.append(name,avatar,imgInput,clearImg,save);parent.append(line,preview);return {name,avatar,imgInput,clearImg,save}}
function box(root,title,help,id){const b=node('section',null,'editor');if(id)b.id=id;const head=node('div',null,'section-title');head.append(node('h2',title));b.append(head);if(help)b.append(node('p',help,'helper'));root.append(b);return b}
function visible(id,kind){const p=extra();return !p||!(p.hidden||[]).includes(kind+':'+id)}
function toggleVisible(id,kind){const p=extra();if(!p)return;const k=kind+':'+id;if(p.hidden.includes(k))p.hidden=p.hidden.filter(x=>x!==k);else p.hidden.push(k);persist();openMode()}
function showLanding(){activeProfile=null;mode='student';$id('workspace').hidden=true;$id('landing').hidden=false;$id('headtools').replaceChildren();const root=$id('landing');root.replaceChildren();root.append(node('h1','Ma CAA École'),node('p','Qui utilise l’application ?'));

function renderAdmin(root){setHead('Mode Administrateur','Tableau de bord');const page=node('div',null,'modepage');root.append(page);const search=modeHeader(page,'Mode administrateur','Que veux-tu gérer ?','Base commune, profils, catégories et pictogrammes.','Rechercher un profil, une catégorie, une sous-catégorie ou un pictogramme...');const cards=node('div',null,'dashboard-grid');cards.append(dashboardCard('👤','Profils / utilisateurs','Créer, modifier et ouvrir les profils','blue','admin-profiles'),dashboardCard('🗂️','Catégories','Gérer la structure de la base commune','green','admin-cats'),dashboardCard('🧩','Pictogrammes','Modifier les pictos de la base','purple','admin-items'),dashboardCard('🔐','Paramètres','Codes d’accès et sécurité','gray','admin-settings'));page.append(cards);
 let b=box(page,'Profils / utilisateurs','Chaque profil hérite de la base commune et conserve ses adaptations personnelles.','admin-profiles');profileForm(b,null);db.profiles.forEach(p=>{const r=node('div',null,'editrow filter-item');const left=node('div',null,'profileline');left.append(avatarNode(p,'avatar small'));const txt=node('div');txt.append(node('strong',p.name));txt.append(node('div',p.avatarImage?'Photo / image personnalisée':(p.avatar?'Pictogramme / emoji personnalisé':'Initiales automatiques'),'helper'));left.append(txt);r.append(left);const actions=node('div');actions.append(button('Modifier',()=>{const ed=node('div',null,'editor');ed.append(node('h2','Modifier le profil'));profileForm(ed,p);r.after(ed)}),button('Ouvrir',()=>selectProfile(p.id)),button('Supprimer',()=>{if(confirm('Supprimer définitivement le profil '+p.name+' et ses personnalisations ?')){db.profiles=db.profiles.filter(x=>x.id!==p.id);if(activeProfile===p.id)activeProfile=null;persist();renderAdmin(rootReset())}}));r.append(actions);b.append(r)});
 b=box(page,'Catégories et sous-catégories','Tu peux tout renommer, déplacer ou supprimer. Les personnalisations existantes sont conservées lorsque les identifiants ne changent pas.','admin-cats');const nm=field('','Nouvelle catégorie'),ico=field('📚','Emoji');row(b,nm,ico,button('Ajouter une catégorie',()=>{if(!nm.value.trim())return;db.base.categories.push({id:uid(),name:nm.value.trim(),icon:ico.value||'📚',desc:'',children:[]});syncCats();renderAdmin(rootReset())}));db.base.categories.forEach((c,ix)=>{const r=node('div',null,'editrow filter-item');r.append(node('strong',c.icon+' '+c.name));const actions=node('div');actions.append(button('Modifier',()=>{const n=prompt('Nom',c.name);if(n===null)return;const i=prompt('Emoji',c.icon);if(n.trim()){c.name=n.trim();c.icon=i||'📚';syncCats();renderAdmin(rootReset())}}),button('↑',()=>{if(ix){[db.base.categories[ix-1],db.base.categories[ix]]=[c,db.base.categories[ix-1]];syncCats();renderAdmin(rootReset())}}),button('↓',()=>{if(ix<db.base.categories.length-1){[db.base.categories[ix+1],db.base.categories[ix]]=[c,db.base.categories[ix+1]];syncCats();renderAdmin(rootReset())}}),button('Sous-catégorie +',()=>{const n=prompt('Nom de la sous-catégorie');if(n?.trim()){c.children ||= [];c.children.push({id:uid(),name:n.trim()});persist();renderAdmin(rootReset())}}),button('Supprimer',()=>{if(confirm('Supprimer cette catégorie, ses sous-catégories et ses pictogrammes personnalisés de la base ?')){db.base.categories=db.base.categories.filter(x=>x.id!==c.id);db.base.items=db.base.items.filter(x=>x.cat!==c.id);syncCats();renderAdmin(rootReset())}}));r.append(actions);b.append(r);(c.children||[]).forEach(sc=>{const sr=node('div',null,'editrow filter-item');sr.style.paddingLeft='30px';sr.append(node('span','↳ '+sc.name));const sa=node('div');sa.append(button('Renommer',()=>{const n=prompt('Nom',sc.name);if(n?.trim()){sc.name=n.trim();persist();renderAdmin(rootReset())}}),button('Supprimer',()=>{if(confirm('Supprimer la sous-catégorie et ses pictogrammes ?')){c.children=c.children.filter(x=>x.id!==sc.id);db.base.items=db.base.items.filter(x=>x.sub!==sc.id);persist();renderAdmin(rootReset())}}));sr.append(sa);b.append(sr)})});
 b=box(page,'Pictogrammes de la base commune','Ajouter ou modifier des images, des textes et la parole. Les éléments d’origine restent accessibles ci-dessous.','admin-items');editItemForm(b,null,false);getBaseItems().forEach(item=>editItemRow(b,item,false));
 b=box(page,'Paramètres','Optionnel : sans code, les espaces de gestion restent accessibles à toute personne utilisant l’appareil.','admin-settings');const a=field(db.settings.adminPin||'','Code Admin'),t=field(db.settings.teacherPin||'','Code Enseignant');a.type=t.type='password';row(b,a,t,button('Enregistrer les codes',()=>{db.settings.adminPin=a.value;db.settings.teacherPin=t.value;persist();alert('Codes enregistrés sur cet appareil.')}));if(search)attachPanelFilter(search,page)}
function rootReset(){const root=$id('content');root.replaceChildren();return root}
function getBaseItems(){const built=[];LETTERS.forEach(x=>built.push({id:'letter-'+x.l,cat:'alphabet',icon:x.l,label:x.l,spoken:x.name,hint:x.hint,type:'legacy'}));Object.entries(VOCAB).forEach(([theme,words])=>words.forEach(([icon,label],index)=>built.push({id:'vocab-'+theme+'-'+index,cat:'vocab',sub:'theme-'+theme,icon,label,spoken:label,type:'legacy'})));CONSIGNES.forEach(([icon,label],index)=>built.push({id:'instruction-'+index,cat:'instructions',icon,label,spoken:label,type:'legacy'}));for(let i=0;i<=20;i++)built.push({id:'num-'+i,cat:'numbers',icon:String(i),label:String(i),spoken:String(i),type:'legacy'});return [...built,...db.base.items].map(x=>({...x,...(db.base.overrides[x.id]||{})}))}
function editItemForm(parent,item,personal){const form=node('div',null,'fields');const cats=db.base.categories.map(c=>[c.id,c.name]);let cat=selection(cats,item?.cat||editCategory);const icon=field(item?.icon||'🖼️','Emoji ou lettre'),label=field(item?.label||'','Texte'),spoken=field(item?.spoken||'','Voix');const sub=selection([],item?.sub||'');function refreshSubs(){const c=db.base.categories.find(c=>c.id===cat.value);sub.replaceChildren();[['','Aucune'],...(c?.children||[]).map(x=>[x.id,x.name]),...(cat.value==='vocab'?Object.keys(VOCAB).map(k=>['theme-'+k,k]):[])].forEach(([id,n])=>{const o=node('option',n);o.value=id;sub.append(o)});sub.value=item?.sub||''}cat.onchange=refreshSubs;refreshSubs();const imageInput=node('input');imageInput.type='file';imageInput.accept='image/*';imageInput.title='Image facultative';let image=item?.image||'';imageInput.onchange=()=>{const f=imageInput.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{image=reader.result};reader.readAsDataURL(f)};
 const save=button(item?'Enregistrer':'➕ Ajouter',()=>{if(!label.value.trim())return alert('Le texte est obligatoire.');const updated={cat:cat.value,sub:sub.value,icon:icon.value||'🖼️',label:label.value.trim(),spoken:spoken.value.trim()||label.value.trim(),image};if(personal){const p=extra();if(item){if(item.personal){Object.assign(p.custom.find(x=>x.id===item.id),updated)}else p.modified[item.id]={...(p.modified[item.id]||{}),...updated}}else p.custom.push({...updated,id:uid(),personal:true})}else{if(item){if(item.type==='legacy')db.base.overrides[item.id]=updated;else Object.assign(db.base.items.find(x=>x.id===item.id),updated)}else db.base.items.push({...updated,id:uid()})}persist();if(personal)renderTeacher(rootReset());else renderAdmin(rootReset())});form.append(cat,sub,icon,label,spoken,imageInput,save);parent.append(form)}
function editItemRow(parent,item,personal){const r=node('div',null,'editrow filter-item');const left=node('span');left.textContent=(item.icon||'🖼️')+' '+item.label+' — '+(db.base.categories.find(c=>c.id===item.cat)?.name||'');r.append(left);r.append(button('Modifier',()=>{const b=node('div',null,'editor');editItemForm(b,item,personal);r.after(b)}));if(!personal || item.personal)r.append(button('Supprimer',()=>{if(!confirm('Supprimer ce pictogramme ?'))return;if(personal)extra().custom=extra().custom.filter(x=>x.id!==item.id);else if(item.type==='legacy'){db.base.overrides[item.id]={...(db.base.overrides[item.id]||{}),deleted:true}}else db.base.items=db.base.items.filter(x=>x.id!==item.id);persist();personal?renderTeacher(rootReset()):renderAdmin(rootReset())}));parent.append(r)}
function getProfileItems(){const p=extra();return [...getBaseItems(),...(p?.custom||[])].filter(x=>!x.deleted).map(x=>({...x,...(p?.modified?.[x.id]||{})})).filter(x=>!x.deleted)}
function renderTeacher(root){setHead('Mode Enseignant','Personnalisation du profil : '+active().name);const p=extra();const page=node('div',null,'modepage');root.append(page);const search=modeHeader(page,'Mode enseignant','Réglages du profil','Tu personnalises uniquement le profil « '+active().name+' », sans modifier la base commune.','Rechercher une catégorie ou un pictogramme dans ce profil...');const cards=node('div',null,'dashboard-grid');cards.append(dashboardCard('👁️','Visibilité des catégories','Afficher ou masquer pour ce profil','blue','teacher-cats'),dashboardCard('⭐','Favoris et pictogrammes','Gérer les favoris, l’ordre et la visibilité','purple','teacher-items'),dashboardCard('🖼️','Pictogrammes du profil','Ajouter des pictos propres à ce profil','orange','teacher-custom'));page.append(cards);
 let b=box(page,'Visibilité des catégories','Ces réglages ne concernent que ce profil.','teacher-cats');db.base.categories.forEach(c=>{const r=node('div',null,'editrow filter-item');r.append(node('strong',c.icon+' '+c.name));r.append(button(visible(c.id,'cat')?'👁️ Visible':'🙈 Masqué',()=>toggleVisible(c.id,'cat')));b.append(r);(c.children||[]).forEach(sc=>{const rr=node('div',null,'editrow filter-item');rr.append(node('span','↳ '+sc.name));rr.append(button(visible(sc.id,'sub')?'👁️ Visible':'🙈 Masqué',()=>toggleVisible(sc.id,'sub')));b.append(rr)})});
 b=box(page,'Favoris et pictogrammes','Tu peux masquer, mettre en favori, réordonner ou modifier un pictogramme pour ce profil uniquement.','teacher-items');getProfileItems().forEach(item=>{const r=node('div',null,'editrow filter-item');const left=node('div',null,'profileline');if(item.image) left.append(avatarNode({name:item.label,avatarImage:item.image},'avatar small')); else left.append(node('span',(item.icon||'🖼️')+' '+item.label));r.append(left);const actions=node('div');actions.append(button(visible(item.id,'item')?'👁️ Visible':'🙈 Masqué',()=>toggleVisible(item.id,'item')),button(p.favorites.includes(item.id)?'⭐ Favori':'☆ Favori',()=>{p.favorites=p.favorites.includes(item.id)?p.favorites.filter(x=>x!==item.id):[...p.favorites,item.id];persist();renderTeacher(rootReset())}),button('↑',()=>{const ids=getProfileItems().filter(x=>x.cat===item.cat).map(x=>x.id);const sorted=ids.sort((a,b)=>(p.order[a]??999999)-(p.order[b]??999999));const i=sorted.indexOf(item.id);if(i>0){[sorted[i-1],sorted[i]]=[sorted[i],sorted[i-1]];sorted.forEach((x,k)=>p.order[x]=k);persist();renderTeacher(rootReset())}}),button('↓',()=>{const ids=getProfileItems().filter(x=>x.cat===item.cat).map(x=>x.id);const sorted=ids.sort((a,b)=>(p.order[a]??999999)-(p.order[b]??999999));const i=sorted.indexOf(item.id);if(i<sorted.length-1){[sorted[i+1],sorted[i]]=[sorted[i],sorted[i+1]];sorted.forEach((x,k)=>p.order[x]=k);persist();renderTeacher(rootReset())}}),button('Modifier pour ce profil',()=>{const form=node('div',null,'editor');editItemForm(form,item,true);r.after(form)}));r.append(actions);b.append(r)});
 b=box(page,'Pictogrammes propres à ce profil','Ils ne seront pas ajoutés aux autres profils.','teacher-custom');editItemForm(b,null,true);p.custom.forEach(item=>editItemRow(b,item,true));if(search)attachPanelFilter(search,page)}
function renderExtras(root){if(!activeProfile)return;if(state.cat==="__favorites"){setHead("Favoris","Les pictogrammes favoris de ce profil.");renderItems(root,getProfileItems().filter(x=>extra().favorites.includes(x.id)));return;}const p=extra();const cat=db.base.categories.find(c=>c.id===state.cat);if(!cat)return;if(!["alphabet","writing","vocab","numbers","instructions"].includes(cat.id))setHead(cat.name,cat.desc||"Appuie sur une image pour entendre son nom.");
 // Les sections historiques conservent leur affichage ; les éléments administrés ont priorité.
 if(['alphabet','vocab','instructions','numbers'].includes(cat.id)){
  const all=getBaseItems().filter(x=>x.cat===cat.id);const modified=all.some(x=>db.base.overrides[x.id]||!visible(x.id,'item')||p.modified[x.id]||p.order?.[x.id]!==undefined);
  if(modified){const original=root.querySelector('.grid');if(original)original.remove();if(cat.id==='vocab'){const t=state.vocabTheme;renderItems(root,getProfileItems().filter(x=>x.cat===cat.id&&(x.sub==='theme-'+t||!x.sub)))}else renderItems(root,getProfileItems().filter(x=>x.cat===cat.id))}
  else {const adds=getProfileItems().filter(x=>x.cat===cat.id&&!x.type);if(adds.length)renderItems(root,adds)}
 }else renderItems(root,getProfileItems().filter(x=>x.cat===cat.id));
}
function renderItems(root,items){const p=extra();const all=items.filter(x=>visible(x.id,'item')&&visible(x.cat,'cat')&&(!x.sub||visible(x.sub,'sub'))).sort((a,b)=>{const order=p.order||{};return (order[a.id]??999999)-(order[b.id]??999999)});const grouped=new Map();all.forEach(x=>{const k=x.sub||'';if(!grouped.has(k))grouped.set(k,[]);grouped.get(k).push(x)});grouped.forEach((items,sub)=>{if(sub){const c=db.base.categories.find(c=>c.id===state.cat);const title=(c?.children||[]).find(x=>x.id===sub)?.name||sub.replace('theme-','');root.append(node('h2',title,'subheading'))}const g=node('div',null,'grid');items.forEach(item=>{const shown={...item,...(p.modified[item.id]||{})};const tile=card(shown.icon||'🖼️',shown.label,'',()=>speak(shown.spoken||shown.label));if(shown.image){const e=tile.querySelector('.emoji');if(e){e.replaceChildren();const img=node('img');img.src=shown.image;img.alt=shown.label;img.className='imageicon';e.append(img)}}g.append(tile)});root.append(g)})}
